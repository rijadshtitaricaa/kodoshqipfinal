<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KodoShqip - Kyçu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-aside">
            <h1>KodoShqip</h1>
            <p>Mirësevini në platformën tuaj të mësimit të kodimit në shqip. Kyçuni dhe vazhdoni mësimin.</p>
        </div>
        <div class="auth-form-wrap">
            <h2>Mirësevini sërish</h2>
            <p>Kyçu në llogarinë tënde për të vazhduar mësimin.</p>

            <form id="loginForm">
                <input id="email" type="email" placeholder="Email" required />
                <input id="password" type="password" placeholder="Fjalëkalimi" required />
                <button class="auth-btn" type="submit">Kyçu</button>
                <div id="error" class="auth-error"></div>
            </form>

            <p class="auth-link">Nuk ke llogari? <a href="register.html">Regjistrohu</a></p>
            <p class="auth-link"><a href="index.html">Kthehu në faqen kryesore</a></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const errorEl = document.getElementById('error');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorEl.textContent = '';

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${window.BACKEND_URL || ''}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                let data;
                try {
                    data = await res.json();
                } catch {
                    errorEl.textContent = 'Gabim i serverit. Provoni përsëri.';
                    return;
                }

                if (res.ok && data.message === 'Login successful') {
                    localStorage.setItem('loggedInUser', JSON.stringify(data.user));
                    location.href = 'index.html';
                } else {
                    errorEl.textContent = data.message || 'Kredencialet janë të gabuara';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorEl.textContent = 'Gabim i lidhjes me serverin.';
            }
        });
    </script>
</body>
</html>
