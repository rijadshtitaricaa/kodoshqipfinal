<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KodoShqip - Regjistrohu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-aside">
      <h3>Fillimi i juaj</h3>
      <p>Regjistrohu dhe fillo udhëtimin tënd në kodim me KodoShqip.</p>
    </div>
    <div class="auth-form-wrap">
      <h2>Krijo llogarinë</h2>
      <p>Plotëso formularin për t'u regjistruar.</p>

      <form id="registerForm">
        <input id="email" type="email" placeholder="Email" required />
        <input id="password" type="password" placeholder="Fjalëkalimi" required />
        <button type="submit" class="auth-btn">Regjistrohu</button>
        <div id="msg" class="auth-error" role="alert"></div>
      </form>

      <p class="auth-link">Ke tashmë llogari? <a href="login.html">Kyçu</a></p>
      <p class="auth-link"><a href="index.html">Kthehu në faqen kryesore</a></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      msg.style.color = '';

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const name = email.split('@')[0];

      try {
        const res = await fetch(`${window.BACKEND_URL || ''}/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, name })
        });

        const data = await res.json();

        if (res.ok && data.message === 'User registered successfully') {
          msg.style.color = '#059669';
          msg.textContent = 'Llogaria u krijua! Po ridrejtoheni...';
          localStorage.setItem('loggedInUser', JSON.stringify({ email, name }));
          setTimeout(() => location.href = 'index.html', 1200);
        } else {
          msg.textContent = data.message || 'Gabim në regjistrim';
        }
      } catch (err) {
        console.error('Register error:', err);
        msg.textContent = 'Gabim i lidhjes me serverin.';
      }
    });
  </script>
</body>
</html>
